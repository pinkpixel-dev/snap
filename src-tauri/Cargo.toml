[package]
name = "snap"
version = "0.6.0"
description = "Fast, satisfying desktop image toolbox"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
edition = "2021"

[lib]
name = "snap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }
base64 = "0.22"
kamadak-exif = "0.6"
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "ndarray", "cuda"] }
ndarray = "0.17"
ureq = "3"
directories = "6"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
